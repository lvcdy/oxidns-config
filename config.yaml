# OxiDNS v1.5.1
# 架构：客户端 → OxiDNS(:5335) → 国内DNS / OpenClash(:7874)

log:
  level: error
  file: ./oxidns.log
  rotation:
    type: daily
    max_files: 3

api:
  http:
    listen: 0.0.0.0:9199
    webui:
      root: /usr/share/oxidns/webui

plugins:
  # 定时更新规则
  - tag: cron_update
    type: cron
    args:
      timezone: Asia/Shanghai
      jobs:
        - name: update_rules
          interval: 1d
          executors:
            - $download_rules
            - $reload_rules

  - tag: download_rules
    type: download
    args:
      downloads:
        # 广告拦截规则
        - url: https://anti-ad.net/adguard.txt
          dir: /etc/oxidns/rules
          filename: antiad.txt
        - url: https://adguardteam.github.io/AdGuardSDNSFilter/Filters/filter.txt
          dir: /etc/oxidns/rules
          filename: adguard.txt
        - url: https://adaway.org/hosts.txt
          dir: /etc/oxidns/rules
          filename: adaway.txt
        - url: https://raw.githubusercontent.com/217heidai/adblockfilters/main/rules/adblockdns.txt
          dir: /etc/oxidns/rules
          filename: adblock.txt
        # 恶意域名拦截规则（防黑客/防钓鱼/防恶意软件）
        - url: https://big.oisd.nl
          dir: /etc/oxidns/rules
          filename: oisd_big.txt
        - url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/pro.mini.txt
          dir: /etc/oxidns/rules
          filename: hagezi_pro_mini.txt
        # 地理位置数据（geosite + geoip）
        - url: https://cdn.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geosite.dat
          dir: /etc/oxidns/rules
          filename: geosite.dat
        - url: https://cdn.jsdelivr.net/gh/Loyalsoldier/geoip@release/geoip-only-cn-private.dat
          dir: /etc/oxidns/rules
          filename: geoip.dat
      timeout: 120s
      startup_if_missing: true

  - tag: reload_rules
    type: reload_provider
    args:
      - $ad_rules
      - $security_rules
      - $geoip_cn
      - $geosite_cn
      - $geosite_no_cn
      - $category_ads_all

  # 规则提供者
  - tag: ad_rules
    type: adguard_rule
    args:
      files:
        - /etc/oxidns/rules/antiad.txt
        - /etc/oxidns/rules/adguard.txt
        - /etc/oxidns/rules/adaway.txt
        - /etc/oxidns/rules/adblock.txt

  # 恶意域名拦截规则（防黑客/防钓鱼/防恶意软件）
  - tag: security_rules
    type: adguard_rule
    args:
      files:
        - /etc/oxidns/rules/oisd_big.txt
        - /etc/oxidns/rules/hagezi_pro_mini.txt

  - tag: geoip_cn
    type: geoip
    args:
      file: /etc/oxidns/rules/geoip.dat
      selectors:
        - cn
      country: true

  - tag: geosite_cn
    type: geosite
    args:
      file: /etc/oxidns/rules/geosite.dat
      selectors:
        - cn

  - tag: geosite_no_cn
    type: geosite
    args:
      file: /etc/oxidns/rules/geosite.dat
      selectors:
        - geolocation-!cn

  - tag: category_ads_all
    type: geosite
    args:
      file: /etc/oxidns/rules/geosite.dat
      selectors:
        - category-ads-all
        - win-spy
        - win-extra

  # 域名/IP集合
  - tag: hosts
    type: hosts
    args:
      short_circuit: true

  # 缓存
  - tag: cache_direct
    type: cache
    args:
      size: 8192
      short_circuit: true
      lazy_cache_ttl: 86400
      cache_negative: true
      max_negative_ttl: 60
      negative_ttl_without_soa: 10
      max_positive_ttl: 3600
      min_positive_ttl: 60
      ecs_in_key: false
      dump_file: /etc/oxidns/rules/dns_cache_direct.dump
      dump_interval: 1800

  - tag: cache_remote
    type: cache
    args:
      size: 4096
      short_circuit: true
      lazy_cache_ttl: 86400
      cache_negative: true
      max_negative_ttl: 30
      negative_ttl_without_soa: 10
      max_positive_ttl: 3600
      min_positive_ttl: 60
      ecs_in_key: false
      dump_file: /etc/oxidns/rules/dns_cache_remote.dump
      dump_interval: 1800

  # 广告拦截
  - tag: ad_blackhole
    type: black_hole
    args:
      mode: null
      short_circuit: true

  # 国内DNS转发
  - tag: forward_cn
    type: forward
    args:
      concurrent: 3
      response_selection: balanced
      upstreams:
        - tag: doh_tencent
          addr: https://doh.pub/dns-query
          bootstrap: 119.29.29.29:53
          bootstrap_version: 4
          idle_timeout: 30
          timeout: 5s
        - tag: doh_alibaba
          addr: https://dns.alidns.com/dns-query
          bootstrap: 223.5.5.5:53
          bootstrap_version: 4
          idle_timeout: 30
          timeout: 5s
        - tag: udp_volcengine1
          addr: 180.184.1.1:53
          timeout: 5s
        - tag: udp_volcengine2
          addr: 180.184.2.2:53
          timeout: 5s
      short_circuit: false

  # 国外DNS转发至OpenClash
  - tag: forward_openclash
    type: forward
    args:
      upstreams:
        - tag: openclash_dns
          addr: 127.0.0.1:7874
          timeout: 5s
      short_circuit: true

  # 业务序列
  - tag: local_seq
    type: sequence
    args:
      - exec: $cache_direct
      - matches: has_resp
        exec: accept
      - exec: $forward_cn
      - matches: resp_ip $geoip_cn
        exec: accept
      - exec: reject 3

  - tag: remote_seq
    type: sequence
    args:
      - exec: $cache_remote
      - exec: $forward_openclash
      - exec: reject 3

  # 主序列
  - tag: main_sequence
    type: sequence
    args:
      # 1. 本地 hosts 优先
      - exec: $hosts
      - matches: has_resp
        exec: accept
      # 2. 拦截 PTR 查询，防止内网拓扑泄露
      - matches: qtype PTR
        exec: reject 3
      # 3. HTTPS/SVCB 记录走远程
      - matches: qtype 65
        exec: goto remote_seq
      # 4. 广告拦截
      - matches: qname $category_ads_all
        exec: $ad_blackhole
      - matches: qname $ad_rules
        exec: $ad_blackhole
      # 5. 恶意/钓鱼域名拦截（防黑客）
      - matches: qname $security_rules
        exec: $ad_blackhole
      # 6. 国内域名走国内DNS
      - matches: qname $geosite_cn
        exec: goto local_seq
      # 7. 国外域名走远程
      - matches: qname $geosite_no_cn
        exec: goto remote_seq
      # 8. 其余走远程（fallback）
      - exec: goto remote_seq

  # 监听服务器
  - tag: udp_server
    type: udp_server
    args:
      entry: main_sequence
      listen: :5335

  - tag: tcp_server
    type: tcp_server
    args:
      entry: main_sequence
      listen: :5335