# OxiDNS v1.5.1
# 架构：客户端 → OxiDNS(:5335) → 国内DNS / OpenClash(:7874)

log:
  level: info
  file: ./oxidns.log
  rotation:
    type: daily
    max_files: 3

api:
  http:
    listen: 0.0.0.0:9199
    webui:
      root: /usr/share/oxidns/webui

plugins:
  - tag: cron_update
    type: cron
    args:
      timezone: Asia/Shanghai
      jobs:
        - name: update_rules
          interval: 1d
          executors:
            - $download_rules
            - $reload_rules

  - tag: download_rules
    type: download
    args:
      downloads:
        # 广告拦截规则
        - url: https://anti-ad.net/adguard.txt
          dir: /etc/oxidns/rules
          filename: antiad.txt
        - url: https://raw.githubusercontent.com/217heidai/adblockfilters/main/rules/adblockdns.txt
          dir: /etc/oxidns/rules
          filename: adblock.txt
        # 恶意域名拦截规则
        - url: https://big.oisd.nl
          dir: /etc/oxidns/rules
          filename: oisd_big.txt
        # 地理位置数据
        - url: https://cdn.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geosite.dat
          dir: /etc/oxidns/rules
          filename: geosite.dat
        - url: https://cdn.jsdelivr.net/gh/Loyalsoldier/geoip@release/geoip-only-cn-private.dat
          dir: /etc/oxidns/rules
          filename: geoip.dat
      timeout: 120s
      startup_if_missing: true

  - tag: reload_rules
    type: reload_provider
    args:
      - $ad_rules
      - $security_rules
      - $geoip_cn
      - $geosite_cn
      - $geosite_no_cn
      - $ms_ncsi_white

  # 规则提供者
  - tag: ad_rules
    type: adguard_rule
    args:
      files:
        - /etc/oxidns/rules/antiad.txt
        - /etc/oxidns/rules/adblock.txt

  - tag: security_rules
    type: adguard_rule
    args:
      files:
        - /etc/oxidns/rules/oisd_big.txt

  - tag: geoip_cn
    type: geoip
    args:
      file: /etc/oxidns/rules/geoip.dat
      selectors:
        - cn
      country: true

  - tag: geosite_cn
    type: geosite
    args:
      file: /etc/oxidns/rules/geosite.dat
      selectors:
        - cn

  - tag: geosite_no_cn
    type: geosite
    args:
      file: /etc/oxidns/rules/geosite.dat
      selectors:
        - geolocation-!cn

  # 微软 NCSI 连通性测试白名单
  - tag: ms_ncsi_white
    type: domain_set
    args:
      files: []
      domains:
        - msftconnecttest.com
        - msftncsi.com
        - ipv6.msftconnecttest.com
        - www.msftconnecttest.com
        - www.msftncsi.com

  # 域名/IP集合 (已修正为空挂载)
  - tag: hosts
    type: hosts
    args:
      files: []

  # 缓存
  - tag: cache_direct
    type: cache
    args:
      size: 8192
      lazy_cache_ttl: 86400
      cache_negative: true
      max_negative_ttl: 60
      negative_ttl_without_soa: 10
      max_positive_ttl: 3600
      min_positive_ttl: 60
      ecs_in_key: false
      dump_file: /etc/oxidns/rules/dns_cache_direct.dump
      dump_interval: 1800

  - tag: cache_remote
    type: cache
    args:
      size: 4096
      lazy_cache_ttl: 86400
      cache_negative: true
      max_negative_ttl: 30
      negative_ttl_without_soa: 10
      max_positive_ttl: 3600
      min_positive_ttl: 60
      ecs_in_key: false
      dump_file: /etc/oxidns/rules/dns_cache_remote.dump
      dump_interval: 1800

  # 广告黑洞
  - tag: ad_blackhole
    type: black_hole
    args:
      rcode: 3

  # 国内 DoH 转发
  - tag: forward_cn
    type: forward
    args:
      concurrent: 2
      response_selection: balanced
      upstreams:
        - tag: doh_tencent
          addr: https://doh.pub/dns-query
          bootstrap: 119.29.29.29:53
          idle_timeout: 30
          insecure_skip_verify: false
          timeout: 5s
        - tag: doh_alibaba
          addr: https://dns.alidns.com/dns-query
          bootstrap: 223.5.5.5:53
          idle_timeout: 30
          insecure_skip_verify: false
          timeout: 5s
          enable_http3: true

  # 国外DNS转发至OpenClash (:7874)
  - tag: forward_openclash
    type: forward
    args:
      upstreams:
        - tag: openclash_dns
          addr: 127.0.0.1:7874
          timeout: 5s

  # 微软 NCSI 专属直连序列
  - tag: ncsi_seq
    type: sequence
    args:
      - exec: $cache_direct
      - matches: has_resp
        exec: accept
      - exec: $forward_cn
      - exec: accept

  # 业务序列：国内域名
  - tag: local_seq
    type: sequence
    args:
      - exec: $cache_direct
      - matches: has_resp
        exec: accept
      - exec: $forward_cn
      - matches: resp_ip $geoip_cn
        exec: accept
      - exec: drop_resp

  # 业务序列：国外域名
  - tag: remote_seq
    type: sequence
    args:
      - exec: $cache_remote
      - matches: has_resp
        exec: accept
      - exec: $forward_openclash
      - exec: accept

  # 主序列
  - tag: main_sequence
    type: sequence
    args:
      # 1. 本地 hosts 优先
      - exec: $hosts
      - matches: has_resp
        exec: accept

      # 2. 拦截 PTR 查询
      - matches: qtype PTR
        exec: reject 3

      # 3. 微软网络探测绝对直连
      - matches: qname $ms_ncsi_white
        exec: goto ncsi_seq

      # 4. HTTPS/SVCB 记录走远程
      - matches: qtype 65
        exec: goto remote_seq

      # 5. 广告拦截与恶意域名拦截
      - matches: qname $ad_rules
        exec: $ad_blackhole
      - matches: qname $security_rules
        exec: $ad_blackhole

      # 6. 国内域名
      - matches: qname $geosite_cn
        exec: goto local_seq

      # 7. 国外域名
      - matches: qname $geosite_no_cn
        exec: goto remote_seq

      # 8. 兜底回退 (Fallback)
      - exec: goto remote_seq

  # 监听服务器
  - tag: udp_server
    type: udp_server
    args:
      entry: main_sequence
      listen: :5335

  - tag: tcp_server
    type: tcp_server
    args:
      entry: main_sequence
      listen: :5335
