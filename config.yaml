# OxiDNS 1.6.1 migration
# Base: the first (short) configuration.
# Migrated from the second (long) configuration: custom rules, learning, ECS,
# IP selection, redirect, recorder exclusions and routing policies.
# Foreign DNS uses the single OpenClash listener at 127.0.0.1:7874; no backup DNS.

api:
  http:
    # Keep the first configuration's management address. Do not expose this port
    # outside your trusted LAN/firewall.
    listen: 10.0.1.254:9199
    auth:
      type: basic
      username: admin
      password: password
    webui:
      root: /usr/share/oxidns/webui
      index: index.html

log:
  level: info
  file: ./oxidns.log
  rotation:
    type: daily
    max_files: 3

plugins:
  # ============================================================
  # Daily rule updates
  # ============================================================
  - tag: cron_update
    type: cron
    args:
      timezone: Asia/Shanghai
      jobs:
        - name: update_rules
          interval: 1d
          executors:
            - $download_rules
            - $reload_rules

  - tag: download_rules
    type: download
    args:
      timeout: 180s
      startup_if_missing: true
      downloads:
        # AdGuard-format rules used by ad_rules
        - url: https://anti-ad.net/adguard.txt
          dir: /etc/oxidns/rules
          filename: antiad.txt
        - url: https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@main/adblock/ultimate.mini.txt
          dir: /etc/oxidns/rules
          filename: hagezi.txt

        # Geo data used by geosite_cn / geoip_cn
        - url: https://cdn.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geosite.dat
          dir: /etc/oxidns/rules
          filename: geosite.dat
        - url: https://cdn.jsdelivr.net/gh/Loyalsoldier/geoip@release/geoip-only-cn-private.dat
          dir: /etc/oxidns/rules
          filename: geoip.dat

        # Rule lists migrated from the long configuration
        - url: https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/refs/heads/meta/geo/geosite/apple-cn.list
          dir: /etc/oxidns/rules
          filename: apple-cn.list
        - url: https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/china-list.txt
          dir: /etc/oxidns/rules
          filename: china_domain_list.txt
        - url: https://anti-ad.net/domains.txt
          dir: /etc/oxidns/rules
          filename: ad_domain_list.txt
        - url: https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/gfw.txt
          dir: /etc/oxidns/rules
          filename: gfw_domain_list.txt

  - tag: reload_rules
    type: reload_provider
    args:
      - $gfwlist
      - $adlist
      - $applecnlist
      - $chinalist
      - $ad_rules
      - $security_rules
      - $geoip_cn
      - $geosite_cn
      - $critical_remote_services
      - $ms_ncsi_white
      - $selfv4list
      - $selfv6list
      - $cdn_ecs_list
      - $ddnslist
      - $anti-antiadlist
      - $selfadlist
      - $skip_recorder_domain_list
      - $local_ip

  # ============================================================
  # Rule providers
  # The custom files below came from the long configuration. Keep/copy their
  # contents from your existing rules directory; they are not downloadable lists.
  # ============================================================
  - tag: applecnlist
    type: domain_set
    args:
      files:
        - /etc/oxidns/rules/apple-cn.list

  - tag: selfv4list
    type: domain_set
    args:
      files:
        - /etc/oxidns/rules/selfv4_domain_list.txt

  - tag: selfv6list
    type: domain_set
    args:
      files:
        - /etc/oxidns/rules/selfv6_domain_list.txt

  - tag: cdn_ecs_list
    type: domain_set
    args:
      files:
        - /etc/oxidns/rules/ecs_other_isp.txt

  - tag: ddnslist
    type: domain_set
    args:
      files:
        - /etc/oxidns/rules/ddns_domain_list.txt

  - tag: anti-antiadlist
    type: domain_set
    args:
      files:
        - /etc/oxidns/rules/anti-antiad_domain_list.txt

  - tag: selfadlist
    type: domain_set
    args:
      files:
        - /etc/oxidns/rules/selfad_domain_list.txt

  - tag: chinalist
    type: domain_set
    args:
      files:
        - /etc/oxidns/rules/china_domain_list.txt

  - tag: gfwlist
    type: domain_set
    args:
      files:
        - /etc/oxidns/rules/gfw_domain_list.txt

  - tag: adlist
    type: domain_set
    args:
      files:
        - /etc/oxidns/rules/ad_domain_list.txt

  - tag: skip_recorder_domain_list
    type: domain_set
    args:
      files:
        - /etc/oxidns/rules/skip_recorder_domain_list.txt

  - tag: local_ip
    type: ip_set
    args:
      files:
        - "/etc/oxidns/rules/china_ip_list.txt"
      sets:
        - "geoip_cn"

  - tag: learned_china
    type: dynamic_domain_set
    args:
      path: /etc/oxidns/rules/learned_china_list.txt

  - tag: learned_foreign
    type: dynamic_domain_set
    args:
      path: /etc/oxidns/rules/learned_foreign_list.txt

  - tag: geoip_cn
    type: geoip
    args:
      file: /etc/oxidns/rules/geoip.dat
      selectors:
        - cn

  - tag: geosite_cn
    type: geosite
    args:
      file: /etc/oxidns/rules/geosite.dat
      selectors:
        - cn

  - tag: ad_rules
    type: adguard_rule
    args:
      files:
        - /etc/oxidns/rules/antiad.txt

  - tag: security_rules
    type: adguard_rule
    args:
      files:
        - /etc/oxidns/rules/hagezi.txt

  - tag: critical_remote_services
    type: domain_set
    args:
      files: []
      exps:
        - domain:github.com
        - regexp:.*\.githubusercontent\.com$
        - regexp:.*\.githubassets\.com$
        - domain:docker.io
        - domain:docker.com
        - regexp:.*\.quay\.io$
        - domain:pypi.org
        - domain:python.org
        - domain:pythonhosted.org
        - domain:npmjs.com
        - domain:npmjs.org

  - tag: ms_ncsi_white
    type: domain_set
    args:
      files: []
      exps:
        - domain:msftconnecttest.com
        - domain:www.msftconnecttest.com
        - domain:msftncsi.com
        - domain:www.msftncsi.com
        - domain:dns.msftncsi.com

  # ============================================================
  # Matchers
  # ============================================================
  - tag: ad_domains
    type: qname
    args:
      - $selfadlist
      - $adlist

  - tag: anti_ad_domains
    type: qname
    args:
      - $anti-antiadlist

  - tag: ddns_domains
    type: qname
    args:
      - $ddnslist

  - tag: applecn_domains
    type: qname
    args:
      - $applecnlist

  - tag: selfv4_domains
    type: qname
    args:
      - $selfv4list

  - tag: selfv6_domains
    type: qname
    args:
      - $selfv6list

  - tag: cdn_ecs_domains
    type: qname
    args:
      - $cdn_ecs_list

  - tag: china_domains
    type: qname
    args:
      - $chinalist
      - $learned_china
      - $geosite_cn
      - domain:cn

  - tag: gfw_domains
    type: qname
    args:
      - $gfwlist
      - $learned_foreign

  - tag: recorder_skip_domains
    type: qname
    args:
      - $skip_recorder_domain_list

  - tag: resp_local_ip
    type: resp_ip
    args:
      - $local_ip

  # ============================================================
  # Metrics, recorder and rate limiting
  # ============================================================
  - tag: metrics_main
    type: metrics_collector
    args:
      name: home

  - tag: recorder_main
    type: query_recorder
    args:
      path: /etc/oxidns/rules/query_history.sqlite
      retention_days: 2

  - tag: rate_limit_main
    type: rate_limiter
    args:
      qps: 50
      burst: 100
      mask4: 32
      mask6: 128

  # ============================================================
  # Hosts and caches
  # ============================================================
  - tag: hosts
    type: hosts
    args:
      entries:
        - domain:fofa.info 106.75.5.150 106.75.22.118 106.75.71.79 106.75.73.144
      files:
        - /etc/oxidns/rules/hosts.txt

  - tag: cache_direct
    type: cache
    args:
      size: 8192
      short_circuit: true
      lazy_cache_ttl: 3600
      cache_negative: true
      max_negative_ttl: 60
      negative_ttl_without_soa: 10
      max_positive_ttl: 3600
      min_positive_ttl: 10
      ecs_in_key: false
      dump_file: /etc/oxidns/rules/cache_direct.dump
      dump_interval: 1800

  - tag: cache_remote
    type: cache
    args:
      size: 4096
      short_circuit: true
      lazy_cache_ttl: 600
      cache_negative: true
      max_negative_ttl: 30
      negative_ttl_without_soa: 10
      max_positive_ttl: 120
      min_positive_ttl: 10
      ecs_in_key: false
      dump_file: /etc/oxidns/rules/cache_remote.dump
      dump_interval: 1800

  - tag: ad_blackhole
    type: black_hole
    args:
      mode: nxdomain
      short_circuit: true

  - tag: redirect
    type: redirect
    args:
      rules:
        - www.cnbeta.com www.cnbeta.com.cdn.cloudflare.net
        - domain:pool.ntp.org ntp.aliyun.com

  # ============================================================
  # Upstreams
  # ============================================================
  - tag: ChinaDNS
    type: forward
    args:
      concurrent: 3
      response_selection: prefer_positive
      upstreams:
        - tag: doh_tencent
          addr: https://doh.pub/dns-query
          dial_addr: 1.12.12.12
          timeout: 5s
          idle_timeout: 30
        - tag: doh_alibaba
          addr: https://dns.alidns.com/dns-query
          dial_addr: 223.5.5.5
          timeout: 5s
          idle_timeout: 30
          enable_http3: true
        - tag: udp_volcengine
          addr: udp://180.184.1.1:53
          timeout: 3s
          idle_timeout: 30

  - tag: ECSDNS
    type: forward
    args:
      concurrent: 2
      response_selection: balanced
      upstreams:
        - addr: quic://223.5.5.5:853
        - addr: quic://223.6.6.6:853

  - tag: Mihomo
    type: forward
    args:
      upstreams:
        - tag: remote_primary
          addr: udp://127.0.0.1:7874
          timeout: 8s

  # ============================================================
  # ECS and IP selection
  # ============================================================
  - tag: ecs_other_isp
    type: ecs_handler
    args:
      forward: false
      preset: 123.129.194.0
      send: true
      mask4: 24

  - tag: ip_select
    type: ip_selector
    args:
      selection_mode: background
      probe_methods:
        - tcp:443
        - tcp:80
      probe_stagger: 100
      probe_timeout: 300
      max_wait: 400
      top_n: 2
      dnssec_policy: reorder_only
      max_parallel_probes: 128
      cache:
        enabled: true
        size: 4096
        ttl: 3600
        failure_ttl: 60

  # ============================================================
  # Automatic China / Foreign learning
  # ============================================================
  - tag: learn_china
    type: learn_domain
    args:
      provider: learned_china
      phase: before
      questions: first
      qtypes:
        - A
        - AAAA
      rule_kind: domain
      async: true
      error_mode: continue

  - tag: learn_foreign
    type: learn_domain
    args:
      provider: learned_foreign
      phase: before
      questions: first
      qtypes:
        - A
        - AAAA
      rule_kind: domain
      async: true
      error_mode: continue

  # ============================================================
  # Resolution sequences
  # ============================================================
  - tag: china_sequence
    type: sequence
    args:
      - exec: $ip_select
      - exec: $cache_direct
      - matches: has_resp
        exec: accept
      - exec: $ChinaDNS
      - matches: rcode SERVFAIL,REFUSED
        exec: drop_resp
      - matches: has_resp
        exec: accept

  - tag: ncsi_sequence
    type: sequence
    args:
      - exec: $cache_direct
      - matches: has_resp
        exec: accept
      - exec: $ChinaDNS
      - matches: rcode SERVFAIL,REFUSED
        exec: drop_resp
      - matches: has_resp
        exec: accept
      - exec: reject 2

  - tag: remote_sequence
    type: sequence
    args:
      - exec: $cache_remote
      - matches: has_resp
        exec: accept
      # Single foreign upstream: OpenClash only.
      - exec: $Mihomo
      - matches: has_resp
        exec: accept
      - exec: reject 2

  - tag: ecs_sequence
    type: sequence
    args:
      - exec: $ecs_other_isp
      - exec: $ECSDNS

  - tag: final_sequence
    type: sequence
    args:
      - exec: $cache_remote
      - matches: has_resp
        exec: accept
      # No backup DNS is configured; use the sole OpenClash upstream.
      - exec: $Mihomo
      - matches:
          - qtype A,AAAA
          - rcode NOERROR
          - has_wanted_ans
          - $resp_local_ip
        exec: $learn_china
      - matches:
          - qtype A,AAAA
          - rcode NOERROR
          - has_wanted_ans
          - "!$resp_local_ip"
        exec: $learn_foreign
      - matches: has_resp
        exec: accept
      - exec: reject 2

  # ============================================================
  # Main routing sequence
  # ============================================================
  - tag: main_sequence
    type: sequence
    args:
      - matches: "!$rate_limit_main"
        exec: reject 2

      - exec: $metrics_main

      - matches: "!$recorder_skip_domains"
        exec: $recorder_main

      - exec: $hosts
      - matches: has_resp
        exec: accept

      # Keep the first configuration's PTR policy. Local LAN/PTR forwarding
      # to 127.0.0.1:5353 is intentionally not enabled by default because it
      # can loop if that resolver forwards back to OxiDNS:5335.
      - matches: qtype PTR
        exec: reject 3

      # Windows network connectivity checks should bypass the proxy and ad rules.
      - matches: qname $ms_ncsi_white
        exec: goto ncsi_sequence

      # Force important developer/container/package services through OpenClash.
      - matches: qname $critical_remote_services
        exec: goto remote_sequence

      # AdGuard rules + the custom domain-list rules. The custom anti-ad list
      # is an exception list for all three rule sources.
      - matches:
          - qname $ad_rules
          - "!$anti_ad_domains"
        exec: $ad_blackhole

      - matches:
          - qname $security_rules
          - "!$anti_ad_domains"
        exec: $ad_blackhole

      - matches:
          - $ad_domains
          - "!$anti_ad_domains"
        exec: $ad_blackhole

      # DDNS and Apple CN domains retain the long configuration's remote route.
      - matches: $ddns_domains
        exec: goto remote_sequence

      - matches: $applecn_domains
        exec: goto remote_sequence

      - matches: has_resp
        exec: accept

      # Explicit IPv4/IPv6 preference lists.
      - matches:
          - $selfv4_domains
          - qtype AAAA
        exec: reject 0

      - matches:
          - $selfv6_domains
          - qtype A
        exec: reject 0

      # ECS-special domains.
      - matches: $cdn_ecs_domains
        exec: $ecs_sequence

      - matches: has_resp
        exec: accept

      # Custom CNAME/domain redirects.
      - exec: $redirect

      # GFW domains and learned Foreign domains use the proxy.
      - matches: $gfw_domains
        exec: goto remote_sequence

      - matches: has_resp
        exec: accept

      # HTTPS/SVCB queries are routed remotely, as in the first configuration.
      - matches: qtype 65
        exec: goto remote_sequence

      # Known China domains use domestic DNS; if it fails, fall through to
      # the remote final sequence rather than returning a false NXDOMAIN.
      - matches: $china_domains
        exec: $china_sequence

      - matches: has_resp
        exec: accept

      # Unknown domains use the sole OpenClash upstream and may be learned by response IP.
      - exec: $final_sequence

  # ============================================================
  # DNS listeners: preserve the first configuration's local-only port
  # ============================================================
  - tag: udp_server
    type: udp_server
    args:
      entry: main_sequence
      listen: 127.0.0.1:5335

  - tag: tcp_server
    type: tcp_server
    args:
      entry: main_sequence
      listen: 127.0.0.1:5335
